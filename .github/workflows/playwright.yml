name: Playwright Tests & Deploy

on:
  push:
    branches: [ main, master ]

# Grant permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Job 1: Run Playwright automated tests first
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test

  # Job 2: Deploy to GitHub Pages ONLY IF Job 1 passes!
  deploy:
    needs: test # Strictly wait for 'test' job to complete successfully
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # Deploy current directory
    - uses: actions/deploy-pages@v4